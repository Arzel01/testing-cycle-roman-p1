[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roman"
version = "0.1.0"
description = "Roman numeral converter with Tkinter GUI for mutation testing workshop"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mutmut]
paths_to_mutate = ["src/roman/converter.py"]
tests_dir = ["tests/test_converter.py"]
runner = "python -m pytest -x -q tests/test_converter.py"
